# 基础场景配置
# 通用默认配置项，其他场景通过 extends 继承

description: "基础场景配置，提供通用默认值"

# 地图尺寸（单位：米）
# 建议范围：1000-5000
map_size:
  width: 1000
  height: 1000

# 任务数量
# 建议范围：10-100
num_tasks: 10

# 无人机数量
# 建议范围：2-10
num_uavs: 2

# AGV数量
# 建议范围：2-10
num_agvs: 2

# 任务密度
# 建议范围：0.1-1.0
task_density: 0.5

# 障碍物配置
obstacles:
  # 障碍物数量
  # 建议范围：5-30
  count: 5
  # 障碍物类型
  # 可选：building、tree、wall、tower
  types:
    - building
    - tree

# 禁飞区数量
# 建议范围：0-10
num_no_fly_zones: 0

# 时间窗口配置
time_window:
  # 时间窗口大小（单位：分钟）
  # 建议范围：30-120
  size: 60

# 随机种子（用于复现场景）
seed: 42
