# 大型场景配置

# 任务数量
num_tasks: 5

# 地图大小 (x, y)
map_size:
  width: 1000
  height: 1000

# 无人机数量
num_uavs: 5

# AGV数量
num_agvs: 2

# 任务点分布密度（每平方公里任务点数）
task_density: 10

# 障碍物数量与类型
obstacles:
  num: 5
  types:
    - building
    - tree

# 禁飞区数量
num_no_fly_zones: 0

# 时间窗口范围（分钟）
time_window:
  min: 30
  max: 120

# 随机种子
seed: 42