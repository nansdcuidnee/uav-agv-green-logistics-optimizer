# 中型场景配置

# 任务数量
num_tasks: 30

# 地图大小 (x, y)
map_size:
  width: 1000
  height: 1000

# 无人机数量
num_uavs: 5

# AGV数量
num_agvs: 3

# 任务点分布密度（每平方公里任务点数）
task_density: 30

# 障碍物数量与类型
obstacles:
  num: 15
  types:
    - building
    - tree
    - wall

# 禁飞区数量
num_no_fly_zones: 5

# 时间窗口范围（分钟）
time_window:
  min: 20
  max: 180

# 随机种子
seed: 43