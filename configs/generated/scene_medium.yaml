# 中型场景配置
# 继承基础配置
extends: ../base/base.yaml

description: "中型场景配置，测试系统在中等负载下的性能"
scene_type: generated

# 任务数量
num_tasks: 30

# 无人机数量
num_uavs: 5

# AGV数量
num_agvs: 3

# 任务点分布密度（每平方公里任务点数）
task_density: 30

# 障碍物数量与类型
obstacles:
  count: 15
  types:
    - building
    - tree
    - wall

# 禁飞区配置
no_fly_zones:
  count: 5

# 时间窗口范围（分钟）
time_window:
  min: 20
  max: 180
  enabled: true

# 随机种子
seed: 43
