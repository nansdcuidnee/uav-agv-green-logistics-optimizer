# 鲁棒性实验 - 多种子稳定性配置

# 实验类型
experiment_type: seed_stability

# 实验名称
experiment_name: robustness_seed

# 策略列表
strategies:
  - baseline_direct
  - relay_coop
  - energy_priority

# 种子列表（5个不同的种子）
seeds:
  - 42
  - 123
  - 456
  - 789
  - 987

# 基础场景配置
base_config:
  num_tasks: 5
  num_uavs: 2
  num_agvs: 1
  max_steps: 300
  map_size:
    width: 500
    height: 500
  obstacles:
    count: 2
  time_window:
    min: 0
    max: 100
    enabled: true

# 实验说明
description: 多种子稳定性实验，测试同一配置下不同种子的性能稳定性