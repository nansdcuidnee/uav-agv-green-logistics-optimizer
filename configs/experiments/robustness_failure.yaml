# 鲁棒性实验 - 异常事件抗扰动配置

# 实验类型
experiment_type: failure

# 实验名称
experiment_name: robustness_failure

# 策略列表
strategies:
  - baseline_direct
  - relay_coop
  - energy_priority

# 种子
seed: 42

# 故障事件配置
failures:
  - name: no_failure
    description: 无故障（正常情况）
    events: []
  - name: uav_failure_step30
    description: 第30步减少1架UAV
    events:
      - type: uav_removal
        step: 30
        uav_id: 1

# 基础配置
base_config:
  num_tasks: 30
  num_uavs: 3
  num_agvs: 2
  max_steps: 200
  map_size:
    width: 1000
    height: 1000
  obstacles:
    count: 5
  time_window:
    min: 0
    max: 60
    enabled: true

# 实验说明
description: 异常事件抗扰动实验，测试UAV失效、AGV延迟等异常情况下的性能表现