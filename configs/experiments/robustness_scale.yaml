# 鲁棒性实验 - 场景规模扩展性配置

# 实验类型
experiment_type: scale

# 实验名称
experiment_name: robustness_scale

# 策略列表
strategies:
  - baseline_direct
  - relay_coop
  - energy_priority

# 种子
seed: 42

# 场景规模配置
scales:
  - name: scale_20
    num_tasks: 20
    num_uavs: 2
    num_agvs: 1
  - name: scale_50
    num_tasks: 50
    num_uavs: 3
    num_agvs: 2
  - name: scale_100
    num_tasks: 100
    num_uavs: 5
    num_agvs: 3

# 基础配置
base_config:
  max_steps: 300
  map_size:
    width: 1000
    height: 1000
  obstacles:
    count: 5
  time_window:
    min: 0
    max: 60
    enabled: true
    
# 实验说明
description: 场景规模扩展性实验，测试不同任务规模下的性能表现