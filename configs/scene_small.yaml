# 小型场景配置

# 任务数量
num_tasks: 10

# 地图大小 (x, y)
map_size:
  width: 500
  height: 500

# 无人机数量
num_uavs: 2

# AGV数量
num_agvs: 1

# 任务点分布密度（每平方公里任务点数）
task_density: 40

# 障碍物数量与类型
obstacles:
  num: 5
  types:
    - building
    - tree

# 禁飞区数量
num_no_fly_zones: 2

# 时间窗口范围（分钟）
time_window:
  min: 30
  max: 120

# 随机种子
seed: 42