  <line x1="420" y1="320" x2="470" y2="300" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="470" y1="300" x2="520" y2="320" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/>

  <rect x="685" y="305" width="100" height="35" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="705" cy="345" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="765" cy="345" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>

