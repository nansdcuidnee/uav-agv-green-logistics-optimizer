<svg width="1800" height="1180" viewBox="0 0 1800 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <style>
      text {
        font-family: "Microsoft YaHei", "SimHei", "Noto Sans CJK SC", Arial, sans-serif;
        letter-spacing: 0;
      }
      .title { font-size: 54px; font-weight: 800; fill: #111827; }
      .section-title { font-size: 36px; font-weight: 800; }
      .box-title { font-size: 27px; font-weight: 800; }
      .box-text { font-size: 21px; font-weight: 600; fill: #1f2937; }
      .small-text { font-size: 18px; font-weight: 600; fill: #1f2937; }
      .tiny-text { font-size: 15px; font-weight: 600; fill: #1f2937; }
      .blue { fill: #1d4ed8; }
      .green { fill: #047857; }
      .orange { fill: #b45309; }
      .dark { fill: #1f2937; }
      .panel-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 4; stroke-dasharray: 16 12; }
      .panel-green { fill: #ecfdf5; stroke: #047857; stroke-width: 4; stroke-dasharray: 16 12; }
      .panel-orange { fill: #fff7ed; stroke: #b45309; stroke-width: 4; stroke-dasharray: 16 12; }
      .box-blue { fill: #ffffff; stroke: #2563eb; stroke-width: 4; }
      .box-green { fill: #ffffff; stroke: #047857; stroke-width: 4; }
      .box-orange { fill: #ffffff; stroke: #b45309; stroke-width: 4; }
      .box-dark { fill: #ffffff; stroke: #1f2937; stroke-width: 4; }
