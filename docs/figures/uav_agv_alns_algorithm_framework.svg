  <rect x="585" y="650" width="405" height="125" rx="12" class="box-green"/>
  <text x="787" y="695" text-anchor="middle" class="box-title green">UAV-AGV 中继候选</text>
  <text x="787" y="735" text-anchor="middle" class="box-text">AGV 提供中继点协同服务</text>

