  <text x="1587" y="420" text-anchor="middle" class="box-text">贪婪插入</text>
  <text x="1587" y="455" text-anchor="middle" class="box-text">后悔插入</text>
  <text x="1587" y="490" text-anchor="middle" class="box-text">中继感知插入</text>

