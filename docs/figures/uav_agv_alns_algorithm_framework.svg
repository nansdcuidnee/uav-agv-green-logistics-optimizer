  <line x1="845" y1="280" x2="885" y2="280" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <circle cx="125" cy="315" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="125" y1="297" x2="125" y2="333" stroke="#1f2937" stroke-width="3"/>
  <line x1="107" y1="315" x2="143" y2="315" stroke="#1f2937" stroke-width="3"/>
  <circle cx="270" cy="315" r="16" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M250 335 C260 350, 280 350, 290 335" fill="none" stroke="#1f2937" stroke-width="3"/>

