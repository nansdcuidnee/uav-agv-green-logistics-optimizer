  <text x="1297" y="420" text-anchor="middle" class="box-text">随机移除</text>
  <text x="1297" y="455" text-anchor="middle" class="box-text">最差移除</text>
  <text x="1297" y="490" text-anchor="middle" class="box-text">高能耗移除</text>

  <rect x="1470" y="330" width="235" height="175" rx="12" class="box-orange"/>
