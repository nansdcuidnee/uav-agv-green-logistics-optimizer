  <text x="577" y="865" text-anchor="middle" class="box-title green">统一候选池构建</text>
  <text x="577" y="898" text-anchor="middle" class="box-text">直送 / 中继 / 兜底候选集合</text>

  <line x1="275" y1="775" x2="430" y2="825" stroke="#047857" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="787" y1="775" x2="720" y2="825" stroke="#047857" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="95" y="925" width="395" height="55" rx="10" class="box-green"/>
