  <rect x="95" y="540" width="395" height="70" rx="10" class="box-green"/>
  <text x="292" y="585" text-anchor="middle" class="box-title green">任务-车辆状态编码</text>

  <rect x="610" y="540" width="380" height="70" rx="10" class="box-green"/>
