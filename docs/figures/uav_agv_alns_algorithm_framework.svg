  <rect x="80" y="205" width="235" height="150" rx="12" class="box-blue"/>
  <text x="197" y="245" text-anchor="middle" class="box-title blue">配送任务输入</text>
  <text x="197" y="285" text-anchor="middle" class="box-text">取货点 / 送达点</text>
  <text x="197" y="318" text-anchor="middle" class="box-text">载重 / 时窗 / 优先级</text>

  <rect x="360" y="205" width="220" height="150" rx="12" class="box-blue"/>
  <text x="470" y="245" text-anchor="middle" class="box-title blue">UAV 状态</text>
  <text x="470" y="285" text-anchor="middle" class="box-text">位置 / 电量</text>
  <text x="470" y="318" text-anchor="middle" class="box-text">载荷 / 航程</text>

  <rect x="625" y="205" width="220" height="150" rx="12" class="box-blue"/>
