  <line x1="1587" y1="505" x2="1500" y2="555" stroke="#b45309" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="1235" y="680" width="415" height="70" rx="10" class="box-orange"/>
  <text x="1442" y="725" text-anchor="middle" class="box-title orange">接受准则与算子权重更新</text>
  <line x1="1442" y1="630" x2="1442" y2="675" stroke="#b45309" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <path d="M1235 715 C1135 715, 1135 420, 1175 420" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
