  <rect x="1235" y="805" width="415" height="70" rx="10" class="box-orange"/>
  <text x="1442" y="850" text-anchor="middle" class="box-title orange">终止判断与最优解输出</text>
  <line x1="1442" y1="750" x2="1442" y2="800" stroke="#b45309" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="1125" y="1025" width="635" height="95" rx="18" class="box-dark" stroke-dasharray="14 10"/>
  <text x="1442" y="1065" text-anchor="middle" class="box-title dark">协同调度方案输出</text>
  <text x="1442" y="1100" text-anchor="middle" class="box-text">UAV任务分配、AGV中继协同、充电调度、路径与能耗指标</text>
  <line x1="1442" y1="875" x2="1442" y2="1020" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-dark)"/>

  <line x1="1040" y1="280" x2="1120" y2="250" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="1085" y="245" class="small-text">状态输入</text>

  <line x1="990" y1="865" x2="1120" y2="595" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="1035" y="760" class="small-text" transform="rotate(-64 1035 760)">候选解输入</text>

  <path d="M1442 1120 L1442 1150 L80 1150 L80 360" fill="none" stroke="#374151" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/>
  <text x="700" y="1138" text-anchor="middle" class="box-text">执行反馈至环境：车辆位置、电量、任务状态、中继关系与配送完成情况更新</text>
