  <rect x="0" y="0" width="1800" height="1180" fill="#ffffff"/>

  <text x="900" y="70" text-anchor="middle" class="title">UAV-AGV 绿色物流协同调度优化算法框架</text>

  <rect x="40" y="115" width="1040" height="300" rx="22" class="panel-blue"/>
