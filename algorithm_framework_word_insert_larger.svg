<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10in" height="5.77in" viewBox="0 0 2600 1500">
  <defs>
    <marker id="arrowDark" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#047857"/>
    </marker>
    <marker id="arrowOrange" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#b45309"/>
    </marker>

    <symbol id="uav" overflow="visible">
      <g stroke="#1f2937" stroke-width="2.5" fill="#ffffff">
        <ellipse cx="0" cy="0" rx="20" ry="10"/>
        <circle cx="-34" cy="-14" r="11"/>
        <circle cx="34" cy="-14" r="11"/>
        <circle cx="-32" cy="16" r="10"/>
        <circle cx="32" cy="16" r="10"/>
        <path d="M-19 -3 L-34 -14 M19 -3 L34 -14 M-16 6 L-32 16 M16 6 L32 16"/>
        <path d="M-49 -14 L-22 -14 M22 -14 L49 -14 M-46 16 L-21 16 M21 16 L46 16"/>
      </g>
    </symbol>

    <symbol id="user" overflow="visible">
      <g stroke="#1f2937" stroke-width="2.4" fill="#ffffff">
        <circle cx="0" cy="-15" r="12"/>
        <rect x="-15" y="3" width="30" height="38" rx="8"/>
      </g>
    </symbol>

    <symbol id="baseStation" overflow="visible">
      <g fill="none" stroke="#1f2937" stroke-width="3">
        <path d="M0 120 L38 0 L76 120"/>
        <path d="M38 0 V120"/>
        <path d="M14 38 L62 100"/>
        <path d="M62 38 L14 100"/>
        <path d="M10 70 H66"/>
        <path d="M-16 28 C-32 48 -32 76 -16 96"/>
        <path d="M92 28 C108 48 108 76 92 96"/>
      </g>
    </symbol>

    <style>
      .font { font-family: "Microsoft YaHei", "SimHei", "SimSun", Arial, sans-serif; letter-spacing: 0; }
      .math { font-family: "Times New Roman", "Cambria Math", serif; font-style: italic; }
      .title { font-size: 58px; font-weight: 800; }
      .module { font-size: 39px; font-weight: 800; }
      .head { font-size: 33px; font-weight: 800; }
      .label { font-size: 27px; font-weight: 700; }
      .text { font-size: 24px; font-weight: 600; }
      .small { font-size: 21px; font-weight: 600; }
      .tiny { font-size: 18px; font-weight: 600; }
      .panel-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 4; stroke-dasharray: 14 10; }
      .panel-green { fill: #ecfdf5; stroke: #047857; stroke-width: 4; stroke-dasharray: 14 10; }
      .panel-orange { fill: #fff7ed; stroke: #b45309; stroke-width: 4; stroke-dasharray: 14 10; }
      .box { fill: #ffffff; stroke: #263238; stroke-width: 3; }
      .box-blue { fill: #ffffff; stroke: #1d4ed8; stroke-width: 3.4; }
      .box-green { fill: #ffffff; stroke: #047857; stroke-width: 3.4; }
      .box-orange { fill: #ffffff; stroke: #b45309; stroke-width: 3.4; }
      .dash-box { fill: #ffffff; stroke: #374151; stroke-width: 3; stroke-dasharray: 12 8; }
      .line { fill: none; stroke: #1f2937; stroke-width: 4.5; marker-end: url(#arrowDark); }
      .blue-line { fill: none; stroke: #1d4ed8; stroke-width: 4.5; marker-end: url(#arrowBlue); }
      .green-line { fill: none; stroke: #047857; stroke-width: 4.5; marker-end: url(#arrowGreen); }
      .orange-line { fill: none; stroke: #b45309; stroke-width: 4.5; marker-end: url(#arrowOrange); }
      .feedback { fill: none; stroke: #374151; stroke-width: 4; stroke-dasharray: 14 9; marker-end: url(#arrowDark); }
      .edge { fill: none; stroke: #047857; stroke-width: 3.2; }
      .edge-dash { fill: none; stroke: #047857; stroke-width: 3.2; stroke-dasharray: 10 8; }
      .edge-dot { fill: none; stroke: #047857; stroke-width: 3.6; stroke-dasharray: 1 7; stroke-linecap: round; }
      .edge-dashdot { fill: none; stroke: #047857; stroke-width: 3.2; stroke-dasharray: 11 6 2 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="2600" height="1500" fill="#ffffff"/>
  <text x="1300" y="72" text-anchor="middle" class="font title" fill="#111827">动态重构 UAV-ISAC 协同学习算法框架</text>

  <rect x="70" y="125" width="540" height="1160" rx="18" class="panel-blue"/>
  <rect x="690" y="125" width="840" height="1160" rx="18" class="panel-green"/>
  <rect x="1610" y="125" width="920" height="1160" rx="18" class="panel-orange"/>

  <text x="340" y="185" text-anchor="middle" class="font module" fill="#1d4ed8">一、动态环境</text>
  <text x="1110" y="185" text-anchor="middle" class="font module" fill="#047857">二、图状态构建与压缩</text>
  <text x="2070" y="185" text-anchor="middle" class="font module" fill="#b45309">三、MADDPG 协同决策与学习</text>

  <!-- Left: environment as visual blocks -->
  <rect x="115" y="245" width="450" height="300" rx="12" class="box-blue"/>
  <text x="340" y="295" text-anchor="middle" class="font head" fill="#1e40af">UAV-ISAC 场景</text>
  <g stroke="#94a3b8" stroke-width="1.5" opacity="0.65">
    <path d="M150 490 H530"/>
    <path d="M150 430 H530"/>
    <path d="M150 370 H530"/>
    <path d="M220 335 V510"/>
    <path d="M330 335 V510"/>
    <path d="M440 335 V510"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="2.6" fill="none" stroke-dasharray="10 8">
    <path d="M260 355 L390 325"/>
    <path d="M390 325 L500 382"/>
    <path d="M260 355 L365 452"/>
    <path d="M365 452 L500 382"/>
  </g>
  <g transform="translate(260,355) scale(0.86)"><use href="#uav"/></g>
  <g transform="translate(390,325) scale(0.86)"><use href="#uav"/></g>
  <g transform="translate(500,382) scale(0.86)"><use href="#uav"/></g>
  <g transform="translate(365,452) scale(0.86)"><use href="#uav"/></g>
  <g transform="translate(155,382) scale(0.78)"><use href="#baseStation"/></g>
  <g transform="translate(315,455) scale(0.9)"><use href="#user"/></g>
  <g transform="translate(475,462) scale(0.9)"><use href="#user"/></g>
  <text x="340" y="520" text-anchor="middle" class="font tiny" fill="#374151">通信 / 感知 / 用户服务</text>

  <line x1="340" y1="545" x2="340" y2="615" class="blue-line"/>
  <rect x="115" y="615" width="450" height="210" rx="12" class="box-blue"/>
  <text x="340" y="668" text-anchor="middle" class="font head" fill="#1e40af">活动掩码</text>
  <g class="font label" text-anchor="middle">
    <rect x="170" y="705" width="48" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="230" y="705" width="48" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="290" y="705" width="48" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="350" y="705" width="48" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/>
    <rect x="410" y="705" width="48" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/>
    <rect x="470" y="705" width="48" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="194" y="738" fill="#1e40af">1</text>
    <text x="254" y="738" fill="#1e40af">1</text>
    <text x="314" y="738" fill="#1e40af">1</text>
    <text x="374" y="738" fill="#64748b">0</text>
    <text x="434" y="738" fill="#64748b">0</text>
    <text x="494" y="738" fill="#1e40af">1</text>
  </g>
  <text x="340" y="790" text-anchor="middle" class="font text" fill="#1f2937">join 事件 → active_mask 更新</text>

  <line x1="340" y1="825" x2="340" y2="895" class="blue-line"/>
  <rect x="115" y="895" width="450" height="155" rx="12" class="box-blue"/>
  <text x="340" y="950" text-anchor="middle" class="font head" fill="#1e40af">状态输出</text>
  <text x="340" y="1000" text-anchor="middle" class="font label" fill="#1f2937">
    <tspan class="math">o</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>,
    <tspan class="math">S</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>,
    <tspan class="math">r</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>,
    <tspan class="math">m</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>
  </text>

  <rect x="115" y="1110" width="450" height="90" rx="12" class="dash-box"/>
  <text x="340" y="1164" text-anchor="middle" class="font head" fill="#1e40af">环境反馈</text>

  <!-- Center: graph state construction/compression, mostly visual -->
  <rect x="755" y="240" width="710" height="72" rx="10" class="box-green"/>
  <text x="1110" y="285" text-anchor="middle" class="font label" fill="#065f46">节点特征 <tspan class="math">X</tspan><tspan baseline-shift="sub" font-size="19">t</tspan> + 活动掩码 <tspan class="math">m</tspan><tspan baseline-shift="sub" font-size="19">t</tspan></text>

  <line x1="1110" y1="312" x2="1110" y2="360" class="green-line"/>
  <rect x="755" y="360" width="710" height="68" rx="10" class="box-green"/>
  <text x="1110" y="403" text-anchor="middle" class="font label" fill="#065f46">多关系图 <tspan class="math">G</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>=(<tspan class="math">V</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>, <tspan class="math">E</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>, <tspan class="math">R</tspan>)</text>

  <line x1="1110" y1="428" x2="1110" y2="478" class="green-line"/>
  <rect x="755" y="478" width="710" height="300" rx="12" class="box-green"/>
  <text x="1110" y="524" text-anchor="middle" class="font head" fill="#065f46">多关系 UAV 图</text>
  <g transform="translate(1040,632)">
    <path d="M-185 -12 L-72 -80 L70 -66 L180 12 L60 95 L-95 76 Z" class="edge"/>
    <path d="M-185 -12 L70 -66 M-72 -80 L60 95 M-95 76 L180 12" class="edge-dash"/>
    <path d="M-185 -12 L60 95 M-72 -80 L-95 76" class="edge-dot"/>
    <path d="M-72 -80 L180 12 M-185 -12 L-95 76" class="edge-dashdot"/>
    <g stroke="#047857" stroke-width="3.2" fill="#ffffff">
      <circle cx="-185" cy="-12" r="34"/>
      <circle cx="-72" cy="-80" r="34"/>
      <circle cx="70" cy="-66" r="34"/>
      <circle cx="180" cy="12" r="34"/>
      <circle cx="60" cy="95" r="34"/>
      <circle cx="-95" cy="76" r="34"/>
    </g>
    <g class="font tiny" text-anchor="middle" fill="#065f46">
      <text x="-185" y="-5">U1</text>
      <text x="-72" y="-73">U2</text>
      <text x="70" y="-59">U3</text>
      <text x="180" y="19">U4</text>
      <text x="60" y="102">U5</text>
      <text x="-95" y="83">U6</text>
    </g>
  </g>
  <g transform="translate(1248,558)" class="font tiny" fill="#1f2937">
    <rect x="0" y="0" width="205" height="150" rx="8" class="box"/>
    <line x1="16" y1="32" x2="60" y2="32" class="edge"/>
    <text x="75" y="38">空间距离边</text>
    <line x1="16" y1="64" x2="60" y2="64" class="edge-dash"/>
    <text x="75" y="70">通信连通边</text>
    <line x1="16" y1="96" x2="60" y2="96" class="edge-dot"/>
    <text x="75" y="102">覆盖重叠边</text>
    <line x1="16" y1="128" x2="60" y2="128" class="edge-dashdot"/>
    <text x="75" y="134">协同服务边</text>
  </g>

  <line x1="1110" y1="778" x2="1110" y2="838" class="green-line"/>
  <rect x="780" y="838" width="660" height="95" rx="10" class="box-green"/>
  <text x="1110" y="875" text-anchor="middle" class="font label" fill="#065f46">消息传递 / 邻居聚合</text>
  <text x="1110" y="910" text-anchor="middle" class="font label" fill="#1f2937">
    <tspan class="math">h</tspan><tspan baseline-shift="sub" font-size="19">t</tspan><tspan baseline-shift="super" font-size="19">i</tspan>
    = AGG({<tspan class="math">h</tspan><tspan baseline-shift="sub" font-size="19">t</tspan><tspan baseline-shift="super" font-size="19">j</tspan>})
  </text>

  <line x1="1110" y1="933" x2="1110" y2="995" class="green-line"/>
  <g transform="translate(1110,1034)">
    <path d="M-240 -34 H240 L126 82 H-126 Z" fill="#ffffff" stroke="#047857" stroke-width="3.4"/>
    <text x="0" y="10" text-anchor="middle" class="font label" fill="#065f46">Masked Pooling / Attention</text>
    <text x="0" y="48" text-anchor="middle" class="font small" fill="#374151">活动节点聚合</text>
  </g>

  <line x1="1110" y1="1116" x2="1110" y2="1180" class="green-line"/>
  <rect x="775" y="1180" width="670" height="82" rx="10" class="box-green"/>
  <text x="1110" y="1232" text-anchor="middle" class="font label" fill="#065f46">固定维度表示 <tspan class="math">z</tspan><tspan baseline-shift="sub" font-size="19">t</tspan> = f(<tspan class="math">G</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>, <tspan class="math">m</tspan><tspan baseline-shift="sub" font-size="19">t</tspan>)</text>

  <rect x="845" y="1294" width="530" height="58" rx="10" class="dash-box"/>
  <text x="1110" y="1330" text-anchor="middle" class="font label" fill="#1f2937">经验回放</text>

  <!-- Right: MADDPG as network diagram -->
  <rect x="1680" y="240" width="780" height="75" rx="10" class="box-orange"/>
  <text x="2070" y="287" text-anchor="middle" class="font label" fill="#92400e">集中训练、分散执行（CTDE）</text>

  <rect x="1665" y="370" width="350" height="310" rx="12" class="box-orange"/>
  <rect x="2110" y="370" width="350" height="310" rx="12" class="box-orange"/>
  <text x="1840" y="424" text-anchor="middle" class="font head" fill="#92400e">Actor</text>
  <text x="2285" y="424" text-anchor="middle" class="font head" fill="#92400e">Critic</text>
  <g class="font text" text-anchor="middle" fill="#1f2937">
    <rect x="1715" y="462" width="250" height="55" rx="28" class="box"/>
    <text x="1840" y="496">观测 <tspan class="math">o</tspan><tspan baseline-shift="sub" font-size="18">t</tspan><tspan baseline-shift="super" font-size="18">i</tspan>, <tspan class="math">z</tspan><tspan baseline-shift="sub" font-size="18">t</tspan></text>
    <rect x="1715" y="545" width="250" height="55" rx="10" class="box"/>
    <text x="1840" y="581">策略 <tspan class="math">π</tspan><tspan baseline-shift="sub" font-size="18">i</tspan>(·)</text>
    <rect x="1715" y="628" width="250" height="40" rx="8" class="box"/>
    <text x="1840" y="655">动作 <tspan class="math">a</tspan><tspan baseline-shift="sub" font-size="18">t</tspan><tspan baseline-shift="super" font-size="18">i</tspan></text>

    <rect x="2160" y="462" width="250" height="55" rx="28" class="box"/>
    <text x="2285" y="496"><tspan class="math">z</tspan><tspan baseline-shift="sub" font-size="18">t</tspan>, <tspan class="math">a</tspan><tspan baseline-shift="sub" font-size="18">t</tspan></text>
    <rect x="2160" y="545" width="250" height="55" rx="10" class="box"/>
    <text x="2285" y="581"><tspan class="math">Q</tspan><tspan baseline-shift="sub" font-size="18">i</tspan>(·)</text>
    <rect x="2160" y="628" width="250" height="40" rx="8" class="box"/>
    <text x="2285" y="655">TD 误差</text>
  </g>
  <path d="M1965 573 H2160" class="orange-line"/>
  <text x="2064" y="550" text-anchor="middle" class="font tiny" fill="#92400e">联合输入</text>

  <line x1="2070" y1="680" x2="2070" y2="745" class="orange-line"/>
  <rect x="1770" y="745" width="600" height="78" rx="10" class="box-orange"/>
  <text x="2070" y="795" text-anchor="middle" class="font label" fill="#92400e">联合动作 <tspan class="math">a</tspan><tspan baseline-shift="sub" font-size="19">t</tspan></text>

  <line x1="2070" y1="823" x2="2070" y2="890" class="orange-line"/>
  <g class="font small" text-anchor="middle" fill="#1f2937">
    <rect x="1665" y="890" width="235" height="72" rx="8" class="box-orange"/>
    <text x="1783" y="922">轨迹 / 速度</text>
    <text x="1783" y="947">调整</text>
    <rect x="1952" y="890" width="235" height="72" rx="8" class="box-orange"/>
    <text x="2070" y="922">波束 / 功率</text>
    <text x="2070" y="947">分配</text>
    <rect x="2239" y="890" width="235" height="72" rx="8" class="box-orange"/>
    <text x="2357" y="922">用户 / 感知</text>
    <text x="2357" y="947">服务</text>
  </g>

  <line x1="2070" y1="962" x2="2070" y2="1025" class="orange-line"/>
  <rect x="1680" y="1025" width="780" height="115" rx="10" class="dash-box"/>
  <text x="2070" y="1068" text-anchor="middle" class="font head" fill="#92400e">目标网络软更新</text>
  <text x="2070" y="1110" text-anchor="middle" class="font label" fill="#1f2937">
    <tspan class="math">θ</tspan><tspan baseline-shift="sub" font-size="19">i</tspan><tspan baseline-shift="super" font-size="19">π</tspan>,
    <tspan class="math">θ</tspan><tspan baseline-shift="sub" font-size="19">i</tspan><tspan baseline-shift="super" font-size="19">Q</tspan>
    ← gradient update
  </text>

  <!-- Straight cross-module flows -->
  <path d="M565 975 H690" class="line"/>
  <text x="628" y="948" text-anchor="middle" class="font small" fill="#374151">状态 / 掩码</text>
  <path d="M1445 1221 H1610" class="line"/>
  <text x="1530" y="1194" text-anchor="middle" class="font small" fill="#374151">压缩表示 <tspan class="math">z</tspan><tspan baseline-shift="sub" font-size="15">t</tspan></text>
  <path d="M1680 1082 H1535 V1323 H1375" class="feedback"/>
  <text x="1545" y="1298" text-anchor="middle" class="font tiny" fill="#374151">更新经验采样</text>

  <path d="M2070 1140 V1380 H340 V1200" class="feedback"/>
  <text x="1300" y="1420" text-anchor="middle" class="font text" fill="#374151">动作执行反馈至环境：UAV 位置、链路、服务关系与任务状态更新</text>
</svg>
